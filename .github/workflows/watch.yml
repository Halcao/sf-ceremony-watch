name: SF Ceremony Watch

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sf-ceremony-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python3 -u watch.py

      - name: Commit state if changed
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "sf-ceremony-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          else
            echo "state.json unchanged, nothing to commit"
          fi
